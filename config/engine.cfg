# Parsed before any allocation. Sizes accept K / M / G suffixes (base-1024).

build_game_command      = ..\build\build.bat game nopause
game_source_root = ../game
assets_source_root = ../game/assets

persistent_arena_size   = 128M
ecs_arena_size          = 256M
game_arena_size         = 32M
systems_arena_size      = 8M        # per-frame scratch for system scheduling
frame_arena_size        = 16M       # per worker thread
scratch_arena_size      = 4M        # per worker thread
renderer_arena_size     = 64M
upload_arena_size       = 96M       # CPU staging for GPU buffer uploads

reserved_thread_count   = 1
max_entities            = 2097152
job_queue_capacity      = 65536

window_title            = Engine
window_width            = 1600
window_height           = 900

assets_root             = data

ui_enabled              = 1
ui_arena_size           = 32M       # includeds font atlas, nodes, and IM allocations for now
ui_font_path            = C:/Windows/Fonts/arial.ttf
ui_font_size            = 15